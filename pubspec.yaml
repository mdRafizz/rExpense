name: rexpense
description: "A high-end minimalist expense tracker with cloud sync."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod:
  flutter_riverpod:
  riverpod_annotation:
  equatable: ^2.0.5

  # Local Database
  drift: ^2.20.3
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Dependency Injection
  get_it: ^8.0.2

  # Google Drive / OAuth2
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.2
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Navigation
  go_router: ^14.3.0

  # UI / Charts
  fl_chart: ^0.69.0
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  # Utilities
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  rxdart: ^0.28.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Firebase
  firebase_core: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator:

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/fredokaRegular.ttf
        - asset: assets/fonts/fredokaMedium.ttf
          weight: 500
        - asset: assets/fonts/fredokaSemiBold.ttf
          weight: 600
        - asset: assets/fonts/fredokaBold.ttf
          weight: 700
  assets:
    - assets/fonts/
